services:
  - type: web
    name: vip-telegram-activation
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/vip.sqlite
