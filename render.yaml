services:
  - type: web
    name: vip-telegram-python
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: DB_PATH
        value: vip.sqlite3
